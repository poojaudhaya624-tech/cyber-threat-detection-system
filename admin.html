<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Admin Panel</title>
    <style>
        body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#001B5E,#003C9E,#005BD4);
    color:white;
}
.navbar{
    background:#001845;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:2px solid #00D9FF;
}

.navbar a{
    color:#00E5FF;
    text-decoration:none;
    margin-left:20px;
    font-weight:bold;
}

/* Title */
h2{
    text-align:center;
    color:#00d9ff;
    margin:30px 0;
    font-size:34px;
}

/* Card */
.container{
    width:92%;
    margin:auto;
    background:rgba(255,255,255,0.08);
    padding:25px;
    border-radius:18px;
    box-shadow:0 0 20px rgba(0,217,255,0.3);
}

/* Table */
table{
    width:100%;
    border-collapse:collapse;
    border-radius:12px;
    overflow:hidden;
}

th{
    background:#00bfff;
    color:#001845;
    padding:14px;
}

td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.15);
    text-align:center;
}

tr:nth-child(even){
    background:rgba(0,191,255,0.08);
}

tr:hover{
    background:rgba(0,217,255,0.15);
}
.logo img{
    width:45px;
    height:45px;
    border-radius:8px;
}
    </style>
</head>
<body>

<nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/history">History</a>
    <a href="/analytics">Analytics</a>
    <a href="/admin">Admin</a>
    <a href="/logout">Logout</a>
</nav>

<h1 class="page-title">Admin Panel - All Scan Records</h1>
<table>
<tr>
    <th>User</th>
    <th>Input</th>
    <th>Threat</th>
    <th>Risk</th>
    <th>Date</th>
    <th>Action</th>
</tr>

{% for row in history %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}%</td>
    <td>{{ row[4] }}</td>
    <td>
    <a href="/delete/{{ row[0] }}"
       style="background:red;color:white;padding:6px 10px;border-radius:6px;text-decoration:none;">
       Delete
    </a>
</td>
</tr>
{% endfor %}

</table>

</body>
</html>
